name: Update references

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      # mariana-trench and its manta-storage submodule are private.
      - name: Configure access to mariana-trench
        env:
          MARIANA_TOKEN: ${{ secrets.MARIANA_READ_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${MARIANA_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Regenerate references
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: scripts/update-references.sh

      - name: Check for changes
        id: diff
        run: |
          git add -N skills/
          git diff --quiet skills/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/update-references-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add skills/
          git commit -m "Update references from mariana-trench"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Update references $(date +%Y-%m-%d)" \
            --body "Regenerated from mariana-trench main." \
            --base main
